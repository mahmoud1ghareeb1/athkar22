<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Athkari App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="https://cdn.builder.io/api/v1/image/assets%2F7841fc6e14cc4f5286519ee8641badef%2F96e3a0698a02468496453cc59d50515b?format=png&width=192" />
    <meta name="theme-color" content="#1f2937" />
    <style>
      body {
        font-family: 'Tajawal', sans-serif;
      }
      .font-amiri-quran {
        font-family: 'Amiri Quran', serif;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.1.1/",
    "react/": "https://esm.sh/react@^19.1.1/",
    "react": "https://esm.sh/react@^19.1.1"
  }
}
</script>
</head>
  <body class="bg-gray-900 text-gray-200">
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./service-worker.js').then(registration => {
            console.log('ServiceWorker registration successful with scope: ', registration.scope);
          }, err => {
            console.log('ServiceWorker registration failed: ', err);
          });
        });
      }
    </script>
    <script type="module">
      import { getTafsirUrls } from './offline/tafsirManifest.ts';
      if ('serviceWorker' in navigator) {
        (async () => {
          try {
            const reg = await navigator.serviceWorker.ready;
            const urls = getTafsirUrls();
            if (reg && reg.active && Array.isArray(urls) && urls.length) {
              reg.active.postMessage({ type: 'cache-tafsir', urls });
            }
          } catch (e) {
            console.warn('SW pre-cache tafsir failed', e);
          }
        })();
      }
    </script>
  </body>
</html>
